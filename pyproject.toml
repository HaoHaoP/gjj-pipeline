[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gjj-pipeline"
version = "1.0.0"
description = "南宁公积金数据管线 — 爬虫·清洗·LLM提取"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "beautifulsoup4",
    "lxml",
    "requests",
    "python-dotenv",
    "minio",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
